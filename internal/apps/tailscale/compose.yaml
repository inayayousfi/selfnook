services:
  tailscale-vpn:
    image: tailscale/tailscale:latest@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: selfnook-tailscale-vpn
    hostname: selfnook-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTH_KEY}"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--exit-node=${TAILSCALE_EXIT_NODE} --exit-node-allow-lan-access=true"
    volumes:
      - "${CONFIG_DIR}/tailscale:/var/lib/tailscale"
{{- template "shared" .}}
