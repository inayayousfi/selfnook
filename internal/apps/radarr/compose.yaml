services:
  radarr-app:
    image: lscr.io/linuxserver/radarr:latest@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
    container_name: selfnook-radarr-app
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      RADARR__SERVER__URLBASE: /radarr
      RADARR__AUTH__METHOD: External
    volumes:
      - "${CONFIG_DIR}/radarr:/config"
      - "${MEDIA_DIR}:/media"
    depends_on:
      - "${RADARR_DOWNLOADS}"
      - "${RADARR_INDEXERS}"
