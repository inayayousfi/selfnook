services:
  caddy:
    image: caddy:2@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    container_name: selfnook-caddy
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
{{- range .OwnPorts}}
      - "{{.}}:{{.}}/tcp"
{{- end}}
    volumes:
      - "${CONFIG_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${CONFIG_DIR}/caddy/certs:/certs:ro"
      - "${CONFIG_DIR}/caddy/data:/data"
      - "${CONFIG_DIR}/caddy/config:/config"
    networks:
      default:
        # Containers reach the access address through Caddy, as browsers do.
        aliases:
          - "${ADMIN_ACCESS_HOST}"
{{- range .Routes}}{{with .Internal}}
          - {{.Name}}
{{- end}}{{end}}
